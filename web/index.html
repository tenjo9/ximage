<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>WASM Drawing Test</title>
        <style>
            body {
                background: #252222;
            }
        </style>
    </head>
    <body>
        <div>
            <canvas id="canvas_a" width="800" height="600"></canvas>
        </div>
        <div>
            <canvas id="canvas_b" width="800" height="600"></canvas>
        </div>
    </body>
    <script>
        (async () => {
            const wasm_b64 = "WASM_BLOB";
            const bytes = Uint8Array.from(atob(wasm_b64), c => c.charCodeAt(0));

            const { instance } = await WebAssembly.instantiate(bytes);
            const wasm = instance.exports;

            const width  = 800;
            const height = 600;
            const ptr    = wasm.canvas;
            const pixels = new Uint8ClampedArray(wasm.memory.buffer, ptr, width*height*4);

            function start_demo(canvas, draw) {
                const ctx = canvas.getContext("2d");
                let animid = null;
                let last_time = 0;

                function animate(time) {
                    const dt = (time - last_time)/1000;
                    last_time = time;
                    draw(dt);
                    ctx.putImageData(new ImageData(pixels, width, height), 0, 0);
                    animid = requestAnimationFrame(animate);
                };

                canvas.addEventListener("mouseenter", () => {
                    last_time = performance.now();
                    animid = requestAnimationFrame(animate);
                });

                canvas.addEventListener("mouseleave", () => {
                    cancelAnimationFrame(animid);
                });

                draw(0);
                ctx.putImageData(new ImageData(pixels, width, height), 0, 0);
            }

            start_demo(canvas_a, wasm.draw_demo_a);
            start_demo(canvas_b, wasm.draw_demo_b);
        })();
    </script>
</html>
